<header class="outlearn-header" role="banner">
  <div class="outlearn-header__inner">

    <div class="outlearn-header__left">
      <button class="outlearn-menu-btn" type="button" id="menuBtn" aria-label="Open menu" aria-expanded="false"
        aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>

      <a class="outlearn-logo" href="index.html" aria-label="OutlearnTest — go to homepage">
        <img src="../outlearn-logo.png" alt="outlearn" width="120" height="28" loading="eager" decoding="async">
      </a>
    </div>

    <button class="kb-search-trigger" id="searchTrigger" type="button" data-chrome-search-trigger
      aria-label="Open search" aria-haspopup="dialog" aria-controls="spotlight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <span class="kb-search-trigger__label">Ask anything</span>
      <span class="kb-search-trigger__kbd" aria-hidden="true">
        <kbd>⌘</kbd><kbd>K</kbd>
      </span>
    </button>

    <div class="outlearn-header__actions">
      <a class="outlearn-header-btn outlearn-header-btn--ghost" href="/contact-us">Contact us</a>
      <a class="outlearn-header-btn outlearn-header-btn--primary"
        href="/users/sign_in?_subdomain=outlearntest">Login</a>
    </div>

  </div>
</header>
